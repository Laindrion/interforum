<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <title>Three.js Manual Rotate + Zoom</title>
   <style>
      body {
         margin: 0;
         overflow: hidden;
         background: #000;
      }

      .hint {
         position: fixed;
         bottom: 12px;
         left: 50%;
         transform: translateX(-50%);
         color: #aaa;
         font-family: Arial, sans-serif;
         font-size: 13px;
         user-select: none;
         pointer-events: none;
      }
   </style>
</head>

<body>

   <div class="hint">Drag to rotate · Scroll to zoom</div>

   <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script>


   <script>
      // Scene
      const scene = new THREE.Scene();

      // Camera
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 3;

      // Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      let cube; // keep name so your existing interaction code works

      const loader = new THREE.GLTFLoader();
      loader.load(
         "./models/Ruchka.glb", // adjust path
         (gltf) => {
            cube = gltf.scene;

            // optional: size/position
            cube.scale.set(1, 1, 1);
            cube.position.set(0, 0, 0);

            scene.add(cube);
         },
         undefined,
         (err) => console.error("Model load error:", err)
      );


      // Light
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 5, 5);
      scene.add(light);

      /* ===== Rotation (drag) ===== */
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;

      // Sensitivity (increase for faster rotation)
      const rotateSpeed = 0.01;

      renderer.domElement.addEventListener("pointerdown", (e) => {
         isDragging = true;
         lastX = e.clientX;
         lastY = e.clientY;
         renderer.domElement.setPointerCapture(e.pointerId);
      });

      renderer.domElement.addEventListener("pointermove", (e) => {

         if (!cube) return;
         /*  if (!isDragging) return; */

         const dx = e.clientX - lastX;
         const dy = e.clientY - lastY;

         // "Game-like" direction:
         // Drag right  -> cube rotates right
         // Drag up     -> cube rotates up
         cube.rotation.y += dx * rotateSpeed;
         cube.rotation.x += dy * rotateSpeed;

         lastX = e.clientX;
         lastY = e.clientY;
      });

      renderer.domElement.addEventListener("pointerup", () => { isDragging = false; });
      renderer.domElement.addEventListener("pointercancel", () => { isDragging = false; });

      /* ===== Zoom (mouse wheel) ===== */
      const minZoom = 1.5;
      const maxZoom = 8;
      const zoomSpeed = 0.002;

      renderer.domElement.addEventListener("wheel", (e) => {
         e.preventDefault();

         camera.position.z += e.deltaY * zoomSpeed;
         camera.position.z = Math.max(minZoom, Math.min(maxZoom, camera.position.z));
      }, { passive: false });

      /* ===== Render loop ===== */
      function animate() {
         requestAnimationFrame(animate);
         renderer.render(scene, camera);
      }
      animate();

      /* ===== Resize ===== */
      window.addEventListener("resize", () => {
         camera.aspect = window.innerWidth / window.innerHeight;
         camera.updateProjectionMatrix();
         renderer.setSize(window.innerWidth, window.innerHeight);
      });

      console.log("THREE version:", THREE.REVISION);
      console.log("GLTFLoader:", THREE.GLTFLoader);
   </script>

</body>

</html>
